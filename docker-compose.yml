version: '3.8'

services:
  omni-socket:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: omni-socket-server
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment:
      - NODE_ENV=${NODE_ENV:-production}
      - PORT=${PORT:-4000}
      - HOST=${HOST:-0.0.0.0}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - CORS_ORIGIN=${CORS_ORIGIN:-*}
      - ADMIN_API_KEY=${ADMIN_API_KEY:-omni_dev_super_secret_key_12345}
      - ADMIN_PANEL_PATH=${ADMIN_PANEL_PATH:-/admin-route}
      - DATABASE_URL=${DATABASE_URL}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:4000/health/live', (r) => process.exit(r.statusCode === 200 ? 0 : 1))"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
